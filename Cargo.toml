[package]
name = "mindmap"
version = "1.0.2"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wgpu", "serde"] }
egui = { version = "0.31", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 显式启用 DX12 后端（eframe 默认只启用了 Metal，Windows 上无法找到适配器）
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = false
panic = "abort"
